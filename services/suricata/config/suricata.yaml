%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: '[172.16.0.0/12]'
    EXTERNAL_NET: '!$HOME_NET'
  port-groups:
    HTTP_PORTS: '80'
default-rule-path: /var/lib/suricata/rules
rule-files:
  - local.rules
af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
outputs:
  - fast:
      enabled: yes
      filename: fast.log
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types: [alert, http, dns, tls, flow]
logging:
  default-log-level: notice
  outputs:
    - console: {enabled: yes}
    - file: {enabled: yes, filename: suricata.log}
