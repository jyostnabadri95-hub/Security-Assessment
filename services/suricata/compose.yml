services:
  suricata:
    image: jasonish/suricata:7.0.10
    hostname: suricata
    restart: unless-stopped
    command: ['-i', 'eth0', '-c', '/etc/suricata/suricata.yaml']
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    networks: [security_net]
    volumes:
      # The image entrypoint normalizes ownership on startup, so these mounts
      # must be writable even though Suricata only reads them at runtime.
      - ./config/suricata.yaml:/etc/suricata/suricata.yaml
      - ./rules:/var/lib/suricata/rules
      - ../demo/logs:/var/log/suricata
