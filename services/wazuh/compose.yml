services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.manager
    restart: unless-stopped
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    expose: ['1514', '1515', '514/udp', '55000']
    networks: [security_net]
    volumes:
      - wazuh_api_config:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -kfsS https://localhost:55000/ >/dev/null']
      interval: 20s
      timeout: 5s
      retries: 12

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    expose: ['9200']
    networks: [security_net]
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./config/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./config/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./config/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./config/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./config/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WAZUH_DASHBOARD_PORT:-8443}:5601
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    networks: [security_net]
    depends_on: [wazuh.indexer, wazuh.manager]
    volumes:
      - ./config/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./config/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./config/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh-dashboard-app.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom

  wazuh.agent:
    image: wazuh/wazuh-agent:${WAZUH_VERSION:-4.14.6}
    hostname: demo-endpoint
    restart: unless-stopped
    environment:
      WAZUH_MANAGER: wazuh.manager
      WAZUH_REGISTRATION_SERVER: wazuh.manager
      WAZUH_AGENT_NAME: demo-endpoint
    networks: [security_net]
    depends_on: [wazuh.manager]
    volumes:
      - wazuh_agent_data:/var/ossec/data
      - ./config/agent.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ../demo/data/finance:/demo/finance:ro
      - ../demo/data/hr:/demo/hr:ro
      - ../demo/data/confidential:/demo/confidential:ro
      - ../demo/logs:/demo/logs:ro
