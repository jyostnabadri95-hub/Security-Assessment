<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>docker,linux,demo-endpoint</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>20</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>
  <client_buffer><disabled>no</disabled><queue_size>5000</queue_size><events_per_second>500</events_per_second></client_buffer>
  <syscheck>
    <disabled>no</disabled>
    <frequency>60</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories realtime="yes" whodata="yes" report_changes="yes">/demo/finance,/demo/hr,/demo/confidential</directories>
  </syscheck>
  <localfile><log_format>json</log_format><location>/demo/logs/osquery-results.log</location></localfile>
  <localfile><log_format>json</log_format><location>/demo/logs/osqueryd.results.log</location></localfile>
  <localfile><log_format>json</log_format><location>/demo/logs/eve.json</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/dpkg.log</location></localfile>
  <rootcheck><disabled>no</disabled><frequency>3600</frequency></rootcheck>
  <wodle name="syscollector"><disabled>no</disabled><interval>1h</interval><scan_on_start>yes</scan_on_start><hardware>yes</hardware><os>yes</os><network>yes</network><packages>yes</packages><ports all="yes">yes</ports><processes>yes</processes></wodle>
  <logging><log_format>plain</log_format></logging>
</ossec_config>
