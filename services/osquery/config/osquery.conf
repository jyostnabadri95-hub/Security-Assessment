{
  "options": {
    "host_identifier": "hostname",
    "schedule_splay_percent": "10",
    "events_expiry": "3600",
    "logger_rotate": "true"
  },
  "schedule": {
    "usb_inventory_linux": {
      "query": "SELECT usb_address, usb_port, vendor, vendor_id, model, model_id, serial, removable FROM usb_devices;",
      "interval": 10,
      "removed": true
    },
    "mounted_removable_media": {
      "query": "SELECT device, path, type, blocks_size, flags FROM mounts WHERE device LIKE '/dev/sd%';",
      "interval": 10,
      "removed": true
    }
  },
  "packs": {}
}

